<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .map-container {
            width: 100%;
            max-width: 1000px;
            height: 500px;
            margin: 20px auto;
            border: 1px solid #ccc;
            overflow: hidden;
            position: relative;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .test-result {
            margin: 20px auto;
            max-width: 1000px;
            padding: 15px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
        }
        .path-test {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #eee;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Map Loading Test</h1>
    
    <div class="test-result" id="test-results">
        <h2>Testing Map Paths:</h2>
        <div class="path-test" id="test1">
            <h3>./img/map/world-map.svg</h3>
            <div class="map-container">
                <img src="./img/map/world-map.svg" alt="World Map" onerror="document.getElementById('test1').innerHTML += '<p class=\'error\'>Error: Failed to load map from this path</p>';" onload="document.getElementById('test1').innerHTML += '<p class=\'success\'>Success: Map loaded correctly</p>';">
            </div>
        </div>
        
        <div class="path-test" id="test2">
            <h3>img/map/world-map.svg</h3>
            <div class="map-container">
                <img src="img/map/world-map.svg" alt="World Map" onerror="document.getElementById('test2').innerHTML += '<p class=\'error\'>Error: Failed to load map from this path</p>';" onload="document.getElementById('test2').innerHTML += '<p class=\'success\'>Success: Map loaded correctly</p>';">
            </div>
        </div>
        
        <div class="path-test" id="test3">
            <h3>/img/map/world-map.svg</h3>
            <div class="map-container">
                <img src="/img/map/world-map.svg" alt="World Map" onerror="document.getElementById('test3').innerHTML += '<p class=\'error\'>Error: Failed to load map from this path</p>';" onload="document.getElementById('test3').innerHTML += '<p class=\'success\'>Success: Map loaded correctly</p>';">
            </div>
        </div>
    </div>
    
    <script>
        window.onload = function() {
            console.log('Testing map paths...');
        };
    </script>
</body>
</html>
